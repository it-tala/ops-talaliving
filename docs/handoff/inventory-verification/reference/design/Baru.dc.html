<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tambah barang baru</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B43}a:hover{color:#123A2A}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F5F4EF; font-family: Inter, system-ui, sans-serif; color: #14171A; display: flex; flex-direction: column">
<header style="height: 88px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; background: #1E5B43; color: #FFFFFF">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 700; background: rgba(255,255,255,0.16); padding: 12px 18px 12px 10px; border-radius: 12px; min-height: 56px; box-sizing: border-box">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Batal</a>
<span style="font-size: 30px; font-weight: 800">Tambah barang baru</span>
<span style="margin-left: auto; font-size: 20px; font-weight: 700; background: rgba(255,255,255,0.16); padding: 10px 16px; border-radius: 999px">Kode otomatis: AST-0164</span>
</header>
<div style="flex: 1; display: flex; gap: 24px; padding: 22px 24px 24px; box-sizing: border-box; min-height: 0">
<section style="width: 360px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 26px; font-weight: 800">1. Foto dulu</h2>
<button type="button" style="flex: 1; border-radius: 18px; border: 3px dashed #5B6067; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: inherit; color: #14171A; cursor: pointer">
<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#14171A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 28px; font-weight: 800">Ambil foto</span>
<span style="font-size: 18px; font-weight: 600; color: #4A5058">Seluruh barang terlihat</span>
</button>
<div style="display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border: 1px solid #D9D8D2; border-radius: 14px; padding: 14px 16px">
<span style="font-size: 18px; font-weight: 600; color: #4A5058">3. Lokasi</span>
<span style="font-size: 26px; font-weight: 800">PRD · Produksi</span>
<span style="font-size: 17px; font-weight: 600; color: #4A5058">Diambil dari area yang sedang dicek</span>
</div>
</section>
<section style="flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0">
<h2 style="margin: 0; font-size: 26px; font-weight: 800">2. Barang apa ini?</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="12">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 20px; font-weight: 800; line-height: 1.15">{{t.label}}</span>
<span style="font-size: 15px; font-weight: 700; opacity: 0.8">{{t.code}}</span>
</button>
</sc-for>
</div>
<a href="Selesai.dc.html" style="margin-top: auto; min-height: 96px; border-radius: 18px; background: #157A3C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 30px; font-weight: 800">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Simpan {{picked}}</a>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'GRG' }; }
  renderVals() {
    const defs = [
      ['GRG', 'Gergaji', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6zM12 3v2M21 12h-2M12 21v-2M3 12h2'],
      ['AMP', 'Amplas', 'M3 8h18v8H3zM6 8v8M18 8v8M8 12h8'],
      ['SRT', 'Serut', 'M3 15h18v4H3zM6 15l3-6h6l3 6M10 9V6h4v3'],
      ['RTR', 'Router', 'M9 3h6v6H9zM12 9v8M8 17h8M10 21h4'],
      ['BOR', 'Bor', 'M8 3h8v5H8zM12 8v9M10 17l2 4l2-4'],
      ['PRS', 'Press', 'M4 4h16v3H4zM4 17h16v3H4zM8 7v10M16 7v10'],
      ['KMP', 'Kompresor', 'M4 10h14v8H4zM18 13h3M7 18v2M15 18v2M8 10V7h6v3'],
      ['SPR', 'Spray booth', 'M3 4h18v16H3zM8 9h8M9 13l3 3l3-3'],
      ['JHT', 'Mesin jahit', 'M3 18h18M5 18V8h12v4M17 12v6M9 8V5'],
      ['ALS', 'Alat listrik', 'M6 8h10l3 3v2h-3v7h-4v-7H6zM16 8V5'],
      ['ALT', 'Alat tangan', 'M14 4l6 6l-3 3l-6-6zM11 7L4 14l6 6l7-7'],
      ['LAIN', 'Lainnya', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM8 12h.01M12 12h.01M16 12h.01']
    ];
    const sel = this.state.sel;
    const types = defs.map(([code, label, icon]) => {
      const on = code === sel;
      return {
        code, label, icon, on,
        ink: on ? '#FFFFFF' : '#14171A',
        pick: () => this.setState({ sel: code }),
        style: 'min-height:142px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;cursor:pointer;' +
          (on ? 'background:#1E5B43;color:#FFFFFF;border:3px solid #1E5B43;' : 'background:#FFFFFF;color:#14171A;border:2px solid #5B6067;')
      };
    });
    const p = defs.find(d => d[0] === sel);
    return { types, picked: p ? p[1].toLowerCase() : '' };
  }
}
</script>
</body>
</html>
