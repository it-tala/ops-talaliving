<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kondisi dan foto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B43}a:hover{color:#123A2A}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F5F4EF; font-family: Inter, system-ui, sans-serif; color: #14171A; display: flex; flex-direction: column">
<header style="height: 88px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; background: #1E5B43; color: #FFFFFF">
<a href="Cek.dc.html" style="display: flex; align-items: center; gap: 6px; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 700; background: rgba(255,255,255,0.16); padding: 12px 18px 12px 10px; border-radius: 12px; min-height: 56px; box-sizing: border-box">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Kembali</a>
<span style="font-size: 30px; font-weight: 800">Kondisi &amp; foto</span>
<span style="margin-left: auto; font-size: 22px; font-weight: 700">AST-0101 · Gergaji, Pita</span>
</header>
<div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 24px 24px; box-sizing: border-box; min-height: 0">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 26px; font-weight: 800">1. Mesinnya bisa jalan?</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{conds}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</section>
<section style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<h2 style="margin: 0; font-size: 26px; font-weight: 800">2. Ambil foto satu per satu</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div style="{{s.card}}">
<div style="height: 150px; border-radius: 12px; overflow: hidden; background: #EFEEE9; display: flex; align-items: center; justify-content: center">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
<img src="/_blob/af687b020cd9781be9b0644dbf91a71f" alt="Foto yang sudah diambil: {{s.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{s.notDone}}" hint-placeholder-val="{{ true }}">
<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#5B6067" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
</sc-if>
</div>
<span style="font-size: 22px; font-weight: 800">{{s.n}}. {{s.title}}</span>
<span style="font-size: 18px; font-weight: 500; color: #4A5058; line-height: 1.35">{{s.hint}}</span>
<span style="{{s.tag}}">{{s.state}}</span>
</div>
</sc-for>
</div>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<button type="button" onClick="{{shoot}}" style="min-height: 100px; border-radius: 18px; background: #14171A; color: #FFFFFF; border: 0; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: inherit; font-size: 30px; font-weight: 800; cursor: pointer">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>{{shootLabel}}</button>
<a href="Selesai.dc.html" style="{{saveStyle}}">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Simpan</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cond: 'Jalan', done: 1 }; }
  renderVals() {
    const CS = {
      'Jalan': ['#157A3C', '#E3F1E7', '#0F5A2B'],
      'Rusak': ['#B42318', '#FBE7E5', '#7E1810'],
      'Tidak bisa dicoba': ['#5B6067', '#EDEDEA', '#2F3338']
    };
    const conds = Object.keys(CS).map(label => {
      const on = label === this.state.cond; const c = CS[label];
      return {
        label, on,
        pick: () => this.setState({ cond: label }),
        style: 'min-height:84px;border-radius:16px;font-family:inherit;font-size:28px;font-weight:800;cursor:pointer;' +
          (on ? 'background:' + c[0] + ';color:#FFFFFF;border:3px solid ' + c[0] + ';' : 'background:#FFFFFF;color:' + c[2] + ';border:2px solid ' + c[0] + ';')
      };
    });
    const defs = [
      ['Seluruh mesin', 'Mundur sampai mesin terlihat utuh', 'M3 21h18M5 21V9h14v12M8 9V5h8v4'],
      ['Plat nama', 'Dekatkan ke plat merek dan model', 'M3 6h18v12H3zM7 10h6M7 14h10'],
      ['Label / QR', 'Foto stiker kode yang baru ditempel', 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2z'],
      ['Video jalan', 'Nyalakan mesin, rekam 10 detik', 'M4 6h11v12H4zM15 10l5-3v10l-5-3']
    ];
    const done = this.state.done;
    const steps = defs.map(([title, hint, icon], i) => {
      const isDone = i < done, isNow = i === done;
      return {
        n: i + 1, title, hint, icon, done: isDone, notDone: !isDone,
        state: isDone ? 'Sudah' : (isNow ? 'Sekarang' : 'Nanti'),
        card: 'background:#FFFFFF;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;' +
          (isNow ? 'border:4px solid #1F5FAD;' : 'border:2px solid #D9D8D2;'),
        tag: 'align-self:flex-start;padding:6px 14px;border-radius:999px;font-size:18px;font-weight:800;' +
          (isDone ? 'background:#157A3C;color:#FFFFFF;' : (isNow ? 'background:#1F5FAD;color:#FFFFFF;' : 'background:#EDEDEA;color:#2F3338;'))
      };
    });
    const all = done >= 4;
    return {
      conds, steps,
      shoot: () => this.setState({ done: Math.min(4, done + 1) }),
      shootLabel: all ? 'Foto lengkap' : (done === 3 ? 'Rekam video' : 'Ambil foto ' + (done + 1)),
      saveStyle: 'min-height:100px;border-radius:18px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:800;color:#FFFFFF;' +
        (all ? 'background:#157A3C;' : 'background:#7FA791;')
    };
  }
}
</script>
</body>
</html>
