<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Album mesin zona PRD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B43}a:hover{color:#123A2A}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F5F4EF; font-family: Inter, system-ui, sans-serif; color: #14171A; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 88px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; background: #1E5B43; color: #FFFFFF">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 700; background: rgba(255,255,255,0.16); padding: 12px 18px 12px 10px; border-radius: 12px; min-height: 56px; box-sizing: border-box">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Peta</a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 30px; font-weight: 800; line-height: 1.1">PRD · Produksi</span>
<span style="font-size: 18px; font-weight: 600; opacity: 0.9">12 dari 40 sudah dicek</span>
</div>
<div style="margin-left: auto; width: 260px; height: 16px; background: rgba(255,255,255,0.25); border-radius: 999px; overflow: hidden"><div style="width: 30%; height: 100%; background: #FFFFFF"></div></div>
</header>
<div style="padding: 18px 24px 0; display: flex; gap: 12px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="{{gridStyle}}">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<a href="Cek.dc.html" style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 16px; overflow: hidden; text-decoration: none; color: #14171A; border: 1px solid #D9D8D2">
<div style="position: relative; height: {{photoH}}px; background: #DDDCD6">
<img src="{{c.img}}" alt="Foto 2013 {{c.code}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="{{c.badge}}">{{c.status}}</span>
</div>
<div style="padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 28px; font-weight: 800; line-height: 1.1">{{c.code}}</span>
<span style="font-size: 22px; font-weight: 600">{{c.name}}</span>
<span style="font-size: 18px; color: #4A5058; font-weight: 500">Kode lama {{c.old}}</span>
</div>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"columns":{"editor":"enum","options":["2","3"],"default":"3"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filter: 'Semua' }; }
  renderVals() {
    const cols = Number(this.props.columns ?? '3');
    const B = 'position:absolute;left:12px;top:12px;padding:8px 14px;border-radius:999px;font-size:18px;font-weight:700;';
    const ST = {
      'Belum dicek': B + 'background:#FFFFFF;color:#14171A;border:2px solid #14171A;',
      'Cocok': B + 'background:#157A3C;color:#FFFFFF;',
      'Ada yang beda': B + 'background:#B85400;color:#FFFFFF;',
      'Tidak ketemu': B + 'background:#B42318;color:#FFFFFF;'
    };
    const all = [
      ['AST-0101','Gergaji, Pita','S2-01','/_blob/af687b020cd9781be9b0644dbf91a71f','Belum dicek'],
      ['AST-0102','Gergaji, Pita','S2-02','/_blob/8487b81357d79a1a7e53871e3d57ad16','Cocok'],
      ['AST-0103','Gergaji, Pita','S2-03','/_blob/7d5b93d0f169a84919cbffb4d52e7835','Ada yang beda'],
      ['AST-0104','Gergaji, Pita','S2-04','/_blob/296cf3b9752d00e49a41ff1d26c754ad','Belum dicek'],
      ['AST-0072','Serut, Besar','P1-03','/_blob/46ac5c1e37a4ec05df9137595a8b4b72','Tidak ketemu'],
      ['AST-0064','Profil, Spindle Ganda','M2-02','/_blob/d190a81ef2461dd5f894c67f064380d8','Belum dicek']
    ];
    const f = this.state.filter;
    const cards = all
      .filter(r => f === 'Semua' || (f === 'Belum dicek' ? r[4] === 'Belum dicek' : r[4] === 'Ada yang beda' || r[4] === 'Tidak ketemu'))
      .map(([code,name,old,img,status]) => ({ code, name, old, img, status, badge: ST[status] }));
    const filters = ['Semua','Belum dicek','Perlu perhatian'].map(label => ({
      label,
      pick: () => this.setState({ filter: label }),
      style: 'min-height:56px;padding:0 24px;border-radius:999px;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;' +
        (label === f ? 'background:#14171A;color:#FFFFFF;border:2px solid #14171A;' : 'background:#FFFFFF;color:#14171A;border:2px solid #5B6067;')
    }));
    return {
      cards, filters,
      photoH: cols === 2 ? 300 : 210,
      gridStyle: 'flex:1;min-height:0;overflow:auto;padding:18px 24px 24px;display:grid;grid-template-columns:repeat(' + cols + ', minmax(0, 1fr));gap:20px;align-content:start;'
    };
  }
}
</script>
</body>
</html>
