<title>Rancangan Modul Proyek</title>
<style>
/* Layout: an app frame (sidebar + main) that mirrors ops.talaliving, with a plan view beside it.
   Tokens follow the app's own palette: slate ground, white cards, brand green #2f6b52. */
:root {
  --bg: #f1f5f9; --surface: #ffffff; --surface-2: #f8fafc; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --brand: #2f6b52; --brand-strong: #275544; --brand-soft: #e3f4ea; --on-brand: #ffffff;
  --note-bg: #fff8e1; --note-fg: #6b4b00; --note-line: #f2d27a;
  --warn: #a15c07; --warn-soft: #fef3c7; --bad: #b42318; --bad-soft: #fee4e2;
  --info: #1d4ed8; --info-soft: #dbeafe; --violet: #6d28d9; --violet-soft: #ede9fe;
  --shadow: 0 1px 2px rgb(15 23 42 / .04), 0 1px 3px rgb(15 23 42 / .06);
  --font: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #121b2c; --surface-2: #0f1727; --fg: #e2e8f0; --muted: #94a3b8; --line: #23304a;
  --brand: #62b98c; --brand-strong: #9bd5b6; --brand-soft: #16302a; --on-brand: #0b1220;
  --note-bg: #2a2208; --note-fg: #f3d58a; --note-line: #5c4a12;
  --warn: #fbbf24; --warn-soft: #3a2a06; --bad: #f87171; --bad-soft: #3b1414;
  --info: #93c5fd; --info-soft: #132a4d; --violet: #c4b5fd; --violet-soft: #2a1f4a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #121b2c; --surface-2: #0f1727; --fg: #e2e8f0; --muted: #94a3b8; --line: #23304a;
  --brand: #62b98c; --brand-strong: #9bd5b6; --brand-soft: #16302a; --on-brand: #0b1220;
  --note-bg: #2a2208; --note-fg: #f3d58a; --note-line: #5c4a12;
  --warn: #fbbf24; --warn-soft: #3a2a06; --bad: #f87171; --bad-soft: #3b1414;
  --info: #93c5fd; --info-soft: #132a4d; --violet: #c4b5fd; --violet-soft: #2a1f4a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; }
.top .name { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.top .name .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); font-weight: 600; }
.spacer { flex: 1; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.sample { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 99px; font-weight: 600; }

/* plan view */
.plan { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; }
.plan h1 { font-size: 26px; }
.plan h2 { font-size: 18px; margin-bottom: 8px; }
.plan p { margin: 0; max-width: 70ch; }
.lede { display: grid; gap: 8px; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.howto div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; }
.howto b { font-size: 13px; }
.howto .step { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); font-weight: 700; }
.track { background: var(--brand-soft); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; }
.track b { color: var(--brand-strong); }
.seq { display: grid; gap: 10px; counter-reset: s; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr; gap: 4px 14px; box-shadow: var(--shadow); }
.phase .n { grid-row: span 3; width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; }
.phase .n.pre { background: var(--warn-soft); color: var(--warn); }
.phase h3 { font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.phase h3 .id { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.phase h3 .est { font-size: 12px; color: var(--muted); font-weight: 500; }
.phase .why { color: var(--muted); font-size: 13px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; margin-top: 6px; }
.cols h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cols ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--brand); text-decoration: underline; padding: 0; font-size: 13px; }
.deps { font-size: 12px; color: var(--muted); }
table.qa { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.qa th, table.qa td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
table.qa th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }

/* app frame */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 52px); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: grid; align-content: start; gap: 14px; }
.side .grp { display: grid; gap: 2px; }
.side .gt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 8px 4px; font-weight: 600; }
.side button { text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.side button:hover { background: var(--surface-2); }
.side button[aria-current="page"] { background: var(--brand-soft); color: var(--brand-strong); font-weight: 600; }
.side .tag { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--violet-soft); color: var(--violet); font-weight: 600; }
.side .tag.old { background: var(--surface-2); color: var(--muted); }
.main > *, .coll, .room, .card { min-width: 0; }
.main { min-width: 0; grid-template-columns: minmax(0, 1fr); padding: 20px 20px 80px; display: grid; gap: 16px; align-content: start; }
.crumbs { font-size: 12px; color: var(--muted); }
.ph { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; }
.ph h1 { font-size: 22px; }
.ph .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.pri:hover { background: var(--brand-strong); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card.pad { padding: 14px 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.alert .v { color: var(--bad); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.green { background: var(--brand-soft); color: var(--brand-strong); border-color: transparent; }
.pill.amber { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.red { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.blue { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.violet { background: var(--violet-soft); color: var(--violet); border-color: transparent; }

/* design note */
.note { background: var(--note-bg); color: var(--note-fg); border: 1px dashed var(--note-line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; }
.note::before { content: "Rancangan"; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--note-line); color: var(--note-fg); padding: 1px 6px; border-radius: 4px; flex: none; margin-top: 1px; }
body.hide-notes .note { display: none; }

/* pipeline board */
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.lane { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.lane h3 { font-size: 13px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.lane h3 .t { font-size: 12px; color: var(--muted); font-weight: 500; }
.pc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; text-align: left; width: 100%; }
.pc:hover { border-color: var(--brand); }
.pc .code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pc .nm { font-weight: 600; font-size: 13px; }
.pc .row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.pc .val { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.lane.lost { background: var(--surface); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 130px 1fr 24px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track2 { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { height: 100%; background: var(--brand); border-radius: 99px; }

/* project page */
.stepper { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.st { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.st.done { color: var(--brand-strong); background: var(--brand-soft); border-color: transparent; }
.st.cur { color: var(--on-brand); background: var(--brand); border-color: var(--brand); font-weight: 600; }
.arrow { color: var(--muted); font-size: 12px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.facts div { display: grid; gap: 1px; min-width: 0; }
.facts .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.facts .v { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand-strong); border-bottom-color: var(--brand); font-weight: 600; }
.tabs .ph-tag { font-size: 10px; color: var(--violet); margin-left: 4px; }
.tl { display: grid; gap: 0; }
.tle { display: grid; grid-template-columns: 74px 22px 1fr; gap: 10px; padding: 8px 0; }
.tle .d { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tle .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tle .ic.g { background: var(--brand-soft); color: var(--brand-strong); border-color: transparent; }
.tle .ic.b { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tle .ic.a { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tle .ic.v { background: var(--violet-soft); color: var(--violet); border-color: transparent; }
.tle .ic.r { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tle .t { font-size: 13px; }
.tle .t .s { font-size: 12px; color: var(--muted); }

.coll { display: grid; gap: 10px; }
.coll > header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.coll > header h3 { font-size: 15px; }
.room { padding: 0 14px 12px; }
.room h4 { margin: 10px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
table.it { width: 100%; border-collapse: collapse; min-width: 720px; }
table.it th, table.it td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
table.it th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
table.it tr.click:hover td { background: var(--surface-2); cursor: pointer; }
table.it td.r, table.it th.r { text-align: right; }

.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; font-size: 13px; }
.li .s { font-size: 12px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 99px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.path b { color: var(--fg); font-weight: 600; }

/* drawer + dialog */
.scrim { position: fixed; inset: 0; background: rgb(15 23 42 / .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; box-shadow: -8px 0 32px -12px rgb(15 23 42 / .25);
  display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer > header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.drawer > header h2 { font-size: 17px; }
.drawer .body { overflow-y: auto; padding: 14px 16px; display: grid; gap: 16px; align-content: start; }
.drawer > footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sec { display: grid; gap: 8px; }
.sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.x { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; }
.fld { display: grid; gap: 4px; }
.fld label { font-size: 12px; font-weight: 600; }
.fld .hint { font-size: 12px; color: var(--muted); }
.fld input, .fld select, .fld textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--surface); width: 100%; }
.fld textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.radios { display: flex; flex-wrap: wrap; gap: 6px; }
.radios label { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.alert { border-radius: 8px; padding: 9px 11px; font-size: 13px; display: grid; gap: 6px; }
.alert.amber { background: var(--warn-soft); color: var(--warn); }
.alert.red { background: var(--bad-soft); color: var(--bad); }
.alert.green { background: var(--brand-soft); color: var(--brand-strong); }
.file { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.file:last-child { border-bottom: 0; }
.thumb { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--muted);
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); }
.file .t { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.file .s { font-size: 12px; color: var(--muted); }
.req { display: grid; grid-template-columns: 1fr 160px 110px 28px; gap: 6px; align-items: center; }
.req input, .req select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); width: 100%; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }

/* drafter queue */
.qgrp { border-bottom: 1px solid var(--line); }
.qgrp:last-child { border-bottom: 0; }
.qh { padding: 9px 14px; background: var(--surface-2); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.qh b { font-size: 12.5px; }
.qh .sep { color: var(--muted); }
.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.task .t { font-weight: 600; font-size: 13px; }
.task .s { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.task .msg { grid-column: 1 / -1; }
.task .actions { align-self: start; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; padding: 8px 12px; }
  .side .grp { display: flex; gap: 4px; }
  .side .gt { display: none; }
  .side button { white-space: nowrap; }
  .side .tag { display: none; }
  .main { padding: 16px 16px 80px; }
  .req { grid-template-columns: 1fr 1fr; }
  .bar { grid-template-columns: 110px 1fr 20px; }
  .tle { grid-template-columns: 52px 22px 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .22s cubic-bezier(.16,1,.3,1); }
  @keyframes slide { from { transform: translateX(100%); } to { transform: none; } }
}
</style>

<div class="top">
  <div class="name"><span class="dot">ops</span> Rancangan Modul Proyek</div>
  <div class="seg" role="group" aria-label="Tampilan">
    <button id="v-plan" aria-pressed="true">Rencana &amp; urutan kerja</button>
    <button id="v-prev" aria-pressed="false">Preview halaman</button>

  <span class="sample">Data contoh</span>

</div>

<div id="plan" class="plan"></div>
<div id="prev" class="app" hidden>
  <nav class="side" id="side" aria-label="Menu"></nav>
  <main class="main" id="main"></main>
</div>

<script>

const PROJECTS = [

    ? `<div class="alert green"><b>Disetujui klien</b><span>${esc(i.appr)} · atas render rev ${i.renders > 1 ? "B" : "A"} · bukti: tangkapan WA</span></div>`
    : `<div class="alert amber"><span><b>Belum ada persetujuan klien.</b> Tidak wajib (D374). Kalau gambar kerja dirilis tanpa persetujuan, layar memberi peringatan.</span></div>`;
  drawer(`<span class="mono" style="font-size:13px">${i.no}</span><br>${esc(i.name)}`, `Collection ${i.coll.code} · ${i.coll.name} › ${i.room.name}`, `
    <div style="display:flex;gap:6px;flex-wrap:wrap">${st(i.status)} ${og(i.origin)}</div>
    <div class="facts"><div><span class="l">Qty</span><span class="v num">${i.qty}</span></div><div><span class="l">Ukuran (mm)</span><span class="v num">${i.size}</span></div><div><span class="l">Produk</span><span class="v">dibuat saat dipesan</span></div><div><span class="l">Quotation</span><span class="v">${i.qline}</span></div></div>
    ${i.q ? `<div class="alert red"><b>Pertanyaan terbuka</b><span>${esc(i.q)}</span></div>` : ""}
    ${no === "26007-A-LR-02" ? `<div class="alert amber"><b>Permintaan revisi dari meeting 1 Okt</b><span>Dibuat lebih rendah, 380 mm. Belum dijawab dengan revisi baru.</span></div>` : ""}
    <section class="sec"><h3>File</h3>${files.length ? files.map(f => `<div class="file"><span class="thumb">${f[1].slice(0, 3).toUpperCase()}</span><div><div class="t">${esc(f[0])}</div><div class="s">${f[1]}${f[3] ? " · " + f[3] : ""}</div></div>${og(f[2])}</div>`).join("") : '<p class="muted small">Belum ada file. Unggah render, moodboard, atau gambar dari klien.</p>'}
      <div><button class="btn sm" data-act="upload" data-for="${i.no}">Upload file</button></div></section>
    <section class="sec"><h3>Persetujuan klien</h3>${appr}
      <div id="apprform" hidden class="card pad" style="display:grid;gap:10px">
        <div class="grid2"><div class="fld"><label for="ap-date">Tanggal</label><input id="ap-date" type="date" value="2026-10-06"></div>
        <div class="fld"><label for="ap-ch">Lewat</label><select id="ap-ch"><option>WhatsApp</option><option>Meeting</option><option>Email</option><option>Tanda tangan di gambar</option></select></div></div>
        <div class="fld"><label for="ap-who">Disetujui oleh (pihak klien)</label><input id="ap-who" placeholder="mis. Ibu Lina"></div>
        <div class="fld"><label for="ap-rev">Atas file / revisi</label><select id="ap-rev">${files.filter(f => f[2] === "TALA").map(f => `<option>${esc(f[0])}</option>`).join("") || "<option>(belum ada render)</option>"}</select></div>
        <div class="fld"><label for="ap-ev">Bukti</label><input id="ap-ev" type="file"><span class="hint">Tangkapan WA, foto gambar yang ditandatangani, atau email.</span></div>
        <div><button class="btn pri sm" data-act="toast" data-msg="Preview: persetujuan dicatat (append-only, tidak bisa diedit)">Simpan persetujuan</button></div>
      </div>
      <div><button class="btn sm" data-showappr>Record client approval</button></div></section>
    <section class="sec"><h3>Pekerjaan drafter</h3><p class="small">${i.gk === "—" ? "Belum ada tugas gambar kerja." : "Gambar kerja: " + esc(i.gk)} <button class="linkbtn" data-nav="queue">Buka di Design queue</button></p></section>
    ${note("P4: item desain, file per item dari dua pihak, dan persetujuan klien. Status di atas dihitung dari isi drawer ini.")}`);
}
function peek(code) {
  const p = PROJECTS.find(x => x.code === code);
  drawer(`${p.code} · ${esc(p.name)}`, esc(p.client), `
    <div class="facts"><div><span class="l">Tahap</span><span class="v">${p.stage.replace("_", " ")}</span></div><div><span class="l">PIC sales</span><span class="v">${p.pic}</span></div>
    <div><span class="l">${p.est ? "Perkiraan nilai" : "Quotation berlaku"}</span><span class="v num">${p.value ? rp(p.value) : "belum ada"}</span></div><div><span class="l">Sumber</span><span class="v">${esc(p.src || "—")}</span></div></div>
    ${p.noContract ? '<div class="alert amber">Sudah DEAL tetapi kontrak / SPK / PO klien belum diunggah.</div>' : ""}
    ${note("Halaman proyek lengkap dicontohkan dengan 26007 Residence Kuta. Dari sini Anda bisa mencoba dialog Mark as lost / Cancel project.")}`,
    `<button class="btn" data-open="26007">Buka contoh 26007</button><button class="btn danger" data-lostfor="${p.code}">${["DEAL", "IN_PRODUCTION"].includes(p.stage) ? "Cancel project" : "Mark as lost"}</button>`);
}
function uploadDialog(forItem) {
  const items = ALL_ITEMS.map(i => `<option value="${i.no}" ${i.no === forItem ? "selected" : ""}>Item ${i.no} ${esc(i.name)}</option>`).join("");
  drawer("Upload file", "26007 · Residence Kuta", `
    <div class="fld"><label for="up-file">File</label><input id="up-file" type="file" multiple></div>
    <div class="fld"><label for="up-kind">Jenis</label><select id="up-kind">${KINDS.map(k => `<option value="${k[0]}" ${k[0] === (forItem ? "render" : "gambar_klien") ? "selected" : ""}>${k[1]} · ${k[0]}</option>`).join("")}</select><span class="hint" id="up-drive"></span></div>
    <div class="fld"><label>Asal file</label><div class="radios">
      <label><input type="radio" name="org" value="TALA"> TALA</label><label><input type="radio" name="org" value="KLIEN" checked> Client</label><label><input type="radio" name="org" value="PIHAK3"> Third party (arsitek / desainer klien)</label></div></div>
    <div class="fld"><label for="up-on">Ditempel ke</label><select id="up-on"><option value="P">Proyek (seluruhnya)</option><option value="CA">Collection A · TYPE 2BR</option><option value="CB">Collection B · TYPE 3BR</option>${items}</select></div>
    <div class="fld"><label>Akan disimpan di Drive</label><div class="path" id="up-path"></div></div>
    ${note("Drive dipilih oleh jenis file (doc_kind_drive, batas data pribadi). Folder di dalamnya dipilih oleh drive_paths dengan token baru {CLIENT}, {PROJECT}, {COLLECTION}, {ROOM}, {ITEM}. Jenis file baru ini masih menunggu Q68; tabel ini default-nya.")}`,
    `<button class="btn" data-close>Batal</button><button class="btn pri" data-act="toast" data-msg="Preview: tidak ada file yang diunggah" data-close-after>Upload</button>`);
  const upd = () => {
    const k = KINDS.find(x => x[0] === $("#up-kind").value); const on = $("#up-on").value;
    const base = `${k[2]} / ops-talaliving / <b>CL-0012 PT CONTOH RESIDENCE / 26007 RESIDENCE KUTA</b> / `;
    let tail;
    if (k[3]) tail = k[3];
    else if (on === "P") tail = ["gambar_klien", "referensi_klien"].includes(k[0]) ? "00 DARI KLIEN" : "00 KONSEP";
    else if (on === "CA" || on === "CB") tail = (on === "CA" ? "KOLEKSI A TYPE 2BR" : "KOLEKSI B TYPE 3BR") + " / 00 KONSEP";
    else { const i = ALL_ITEMS.find(x => x.no === on); tail = `KOLEKSI ${i.coll.code} ${i.coll.name} / ${i.room.name.toUpperCase()} / ${i.no} ${i.name.toUpperCase()}`; }
    $("#up-path").innerHTML = base + esc(tail);
    $("#up-drive").textContent = "Drive: " + k[2];
  };
  $("#up-kind").addEventListener("change", upd); $("#up-on").addEventListener("change", upd); upd();
}
function lostDialog(code) {
  const p = PROJECTS.find(x => x.code === code) || PROJECTS.find(x => x.main);
  const after = ["DEAL", "IN_PRODUCTION"].includes(p.stage);
  drawer(after ? "Cancel project" : "Mark as lost", `${p.code} · ${esc(p.name)}`, `
    <p class="small">${after ? "Proyek ini sudah DEAL, jadi statusnya menjadi <b>CANCELLED</b> (batal setelah deal)." : "Proyek ini belum deal, jadi statusnya menjadi <b>LOST</b> (tidak jadi)."} Pipeline dan alasannya ikut terhitung.</p>
    <div class="fld"><label for="lr">Reason</label><select id="lr"><option value="">Pilih alasan…</option>${REASONS.map(r => `<option>${r}</option>`).join("")}</select></div>
    <div class="fld"><label for="ln">Catatan</label><textarea id="ln" placeholder="Apa yang dikatakan klien, dan siapa yang mengatakannya"></textarea><span class="hint">Wajib. Kategori menjawab “berapa banyak”, catatan menjawab “kenapa yang ini”.</span></div>
    <div id="lmsg"></div>
    ${note("D373: tujuh kategori dalam bahasa Inggris, catatan selalu wajib. Ditolak oleh database bila kosong, bukan hanya oleh layar.")}`,
    `<button class="btn" data-close>Batal</button><button class="btn danger" id="lgo">${after ? "Cancel project" : "Mark as lost"}</button>`);
  $("#lgo").addEventListener("click", () => {
    const r = $("#lr").value, n = $("#ln").value.trim();
    if (!r || !n) { $("#lmsg").innerHTML = `<div class="alert red">${!r ? "Pilih alasan." : ""} ${!n ? "Catatan wajib diisi." : ""} Tidak ada yang berubah.</div>`; return; }
    closeOverlay(); toast(`Preview: ${p.code} ditandai ${after ? "CANCELLED" : "LOST"} · ${r}`);
  });
}
function meetingDialog() {
  const opts = ALL_ITEMS.map(i => `<option>${i.no} ${esc(i.name)}</option>`).join("");
  const reqRow = (t, ty, it) => `<div class="req"><input aria-label="Isi" value="${esc(t)}"><select aria-label="Item"><option>— tanpa item —</option>${opts.replace(`<option>${it}`, `<option selected>${it}`)}</select><select aria-label="Jenis"><option ${ty === "d" ? "selected" : ""}>Keputusan</option><option ${ty === "r" ? "selected" : ""}>Revisi diminta</option></select><button class="x" data-delrow aria-label="Hapus baris">×</button></div>`;
  drawer("Log meeting", "26007 · Residence Kuta · PT Contoh Residence", `
    <div class="grid2"><div class="fld"><label for="m-date">Tanggal</label><input id="m-date" type="date" value="2026-10-06"></div>
      <div class="fld"><label for="m-kind">Jenis</label><select id="m-kind"><option>Meeting</option><option>Visit / survei</option></select></div></div>
    <div class="fld"><label>Peserta TALA</label><div class="filters">${["Rina", "Ayu", "Putu", "Dewa", "Pimpinan"].map((n, k) => `<button class="chip" data-toggle aria-pressed="${k < 2}">${n}</button>`).join("")}</div></div>
    <div class="fld"><label for="m-cl">Peserta klien</label><input id="m-cl" value="Ibu Lina, Bp. Agus"></div>
    <div class="fld"><label for="m-notes">Notulen</label><textarea id="m-notes">Presentasi render rev B Type 2BR. Klien suka sofa, minta coffee table lebih rendah.</textarea></div>
    <div class="fld"><label>Keputusan dan permintaan revisi</label><div id="reqs" style="display:grid;gap:6px">
      ${reqRow("Coffee table dibuat lebih rendah, 380 mm", "r", "26007-A-LR-02")}
      ${reqRow("Render sofa 3 seater disetujui", "d", "26007-A-LR-01")}</div>
      <div><button class="btn sm" data-addrow>+ Baris</button></div>
      <span class="hint">Revisi yang menunjuk item muncul di drawer item itu sampai dijawab dengan revisi baru.</span></div>
    <div class="fld"><label for="m-att">Lampiran</label><input id="m-att" type="file" multiple><span class="hint">Notulen yang ditandatangani, foto papan tulis, tangkapan WA. Masuk ke 04 MEETING.</span></div>
    <div class="grid2"><div class="fld"><label for="m-fu">Follow-up</label><input id="m-fu" type="date" value="2026-10-08"></div><div class="fld"><label for="m-next">Yang dilakukan</label><input id="m-next" value="Kirim render coffee table rev C"></div></div>
    ${note("P3. Tetap satu log kontak (0134), append-only: koreksi ditulis sebagai catatan baru. Keputusan “disetujui” di sini bisa langsung menjadi persetujuan klien pada item (D374).")}`,
    `<button class="btn" data-close>Batal</button><button class="btn pri" data-act="toast" data-msg="Preview: meeting dicatat, 1 revisi diteruskan ke Coffee table" data-close-after>Simpan</button>`);
  $("#reqs").dataset.tpl = reqRow("", "r", "");
}

/* ───────────────────────── events ───────────────────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-close], tr[data-item]"); if (!t) return;
  const d = t.dataset;
  if (t.id === "v-plan" || t.id === "v-prev") return setView(t.id === "v-plan" ? "plan" : "prev");
  if ("close" in d) return closeOverlay();
  if (d.go) { setView("prev"); if (d.go === "upload") { go("project", "files"); return uploadDialog(); } if (d.go === "lost") { go("pipeline"); return lostDialog("26004"); } if (d.go === "item") { go("project", "design"); return itemDrawer("26007-A-LR-02"); } if (d.go === "meeting") { go("project", "meetings"); return meetingDialog(); } return go(d.go, d.tab || undefined); }
  if (d.nav) { closeOverlay(); return go(d.nav); }
  if (d.open) { closeOverlay(); return d.open === "26007" ? go("project", route.tab) : peek(d.open); }
  if (d.lostfor) return lostDialog(d.lostfor);
  if (d.tab && t.getAttribute("role") === "tab") return go("project", d.tab);
  if (d.pic) { picFilter = d.pic; return renderMain(); }
  if (d.origin) { originFilter = d.origin; return renderMain(); }
  if (d.coll) { qFilter.coll = d.coll; return renderMain(); }
  if (d.item) return itemDrawer(d.item);
  if (d.release) return release(d.release);
  if (d.confirm) { document.querySelector(`[data-msg-for="${d.confirm}"]`).innerHTML = `<div class="alert green">Revisi dirilis, dengan catatan: belum ada persetujuan klien.</div>`; return; }
  if ("showappr" in d) { $("#apprform").hidden = false; t.hidden = true; return; }
  if ("toggle" in d) { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true"); return; }
  if ("addrow" in d) { $("#reqs").insertAdjacentHTML("beforeend", $("#reqs").dataset.tpl); return; }
  if ("delrow" in d) { t.closest(".req").remove(); return; }
  if (d.act === "upload") return uploadDialog(d.for);
  if (d.act === "lost") return lostDialog("26007");
  if (d.act === "meeting") return meetingDialog();
  if (d.act === "newproject") return toast("Preview: form inquiry baru (klien, nama proyek, PIC, sumber, perkiraan nilai)");
  if (d.act === "toast") { if ("closeAfter" in d) closeOverlay(); return toast(d.msg); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#overlay").innerHTML) closeOverlay(); });
$("#shownotes").addEventListener("change", e => { document.body.classList.toggle("hide-notes", !e.target.checked); store("notes", e.target.checked ? "1" : "0"); });

function setView(v) {
  $("#plan").hidden = v !== "plan"; $("#prev").hidden = v !== "prev";
  $("#v-plan").setAttribute("aria-pressed", v === "plan"); $("#v-prev").setAttribute("aria-pressed", v === "prev");
  if (v === "prev") { renderSide(); renderMain(); }
  try { history.replaceState(null, "", "#" + (v === "plan" ? "rencana" : route.page)); } catch {}
  window.scrollTo(0, 0);
}

renderPlan();
if (store("notes") === "0") { $("#shownotes").checked = false; document.body.classList.add("hide-notes"); }
const h = (location.hash || "").slice(1);
if (["pipeline", "project", "queue", "projects"].includes(h)) { route.page = h; setView("prev"); } else setView("plan");
})();
</script>
