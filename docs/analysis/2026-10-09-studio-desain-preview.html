<style>
/* Layout: an app frame that mirrors ops.talaliving (top bar, screen tabs, persona switch, cards), with the plan as its first screen.
   Tokens follow the app's own palette: slate ground, white cards, brand green #2f6b52. */
:root {

  --shadow: 0 1px 2px rgb(15 23 42 / .04), 0 1px 3px rgb(15 23 42 / .06);

  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #121b2c; --surface-2: #0f1727; --fg: #e2e8f0; --muted: #94a3b8; --line: #23304a;
  --brand: #62b98c; --brand-strong: #9bd5b6; --brand-soft: #16302a; --on-brand: #0b1220;
  --warn: #fbbf24; --warn-soft: #3a2a06; --bad: #f87171; --bad-soft: #3b1414;
  --info: #93c5fd; --info-soft: #132a4d; --violet: #c4b5fd; --violet-soft: #2a1f4a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #121b2c; --surface-2: #0f1727; --fg: #e2e8f0; --muted: #94a3b8; --line: #23304a;
  --brand: #62b98c; --brand-strong: #9bd5b6; --brand-soft: #16302a; --on-brand: #0b1220;
  --warn: #fbbf24; --warn-soft: #3a2a06; --bad: #f87171; --bad-soft: #3b1414;
  --info: #93c5fd; --info-soft: #132a4d; --violet: #c4b5fd; --violet-soft: #2a1f4a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }

<script>
(() => {

const DRAFTERS = ["Made", "Putri", "Andi"];
const SLOTS = [["pdf", "Gambar kerja", "PDF"], ["dwg", "DWG", "DWG"], ["render", "Render", "R"], ["foto", "Foto item", "F"], ["spec", "Spesifikasi", "S"], ["bom", "BOM", "B"]];

const ST = { belum: ["Belum", ""], cek: ["Menunggu cek", "b-blue"], revisi: ["Revisi", "b-amber"], final: ["Final", "b-green"], skip: ["Tidak perlu", ""] };

const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const addWorkDays = (d, n) => { let x = d; while (n > 0) { x = addDays(x, 1); if (new Date(x + "T00:00:00").getDay() !== 0) n--; } return x; };
const days = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const fmt = (d) => { const [, m, dd] = d.split("-"); return `${+dd} ${["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"][+m - 1]}`; };

const nextLetter = (n) => String.fromCharCode(65 + n);

/* A file slot: files[] (rev auto A, B, C) and checks[] (append-only). Spec: versions[]. BOM: read from /produksi/bom. */
const up = (by, at, ext) => ({ by, at, ext });
const ck = (rev, d, by, at, note) => ({ rev, d, by, at, note });

function item(no, name, qty, size, s) { return { no, name, qty, size, ...s }; }
const data = [
  { client: "Bapak Hendra", projects: [{ code: "26003", name: "Villa Canggu", collections: [
    { code: "A", name: "TYPE 2BR", rooms: [
      { code: "LR", name: "Living room", items: [

          bom: { state: "draft", rev: 1 } }),
        item("26003-A-LR-02", "Coffee table travertine", 1, "1200 × 600 × 380", {
          pdf: slot([up("Made", "2026-10-08", "pdf")]), dwg: slot([up("Made", "2026-10-08", "dwg")]),
          render: slot([], [], "Desain dari referensi klien, render tidak dibuat"), foto: slot(),
          spec: { versions: [{ text: "Top travertine 20 mm honed · rangka hollow 40×40 powder coat hitam doff", by: "Made", at: "2026-10-08" }], checks: [], skip: null },
          bom: { state: "none" } }),
        item("26003-A-LR-03", "Rak TV built-in", 1, "3000 × 450 × 2400", { pdf: slot(), dwg: slot(), render: slot(), foto: slot(), spec: { versions: [], checks: [], skip: null }, bom: { state: "none" } }),

/* ── derived, never stored ── */
function state(i, k) {
  const s = i[k];
  if (s.skip) return "skip";
  if (k === "bom") return s.state === "none" ? "belum" : s.state === "draft" ? "cek" : "final";
  if (k === "spec") {
    if (!s.versions.length) return "belum";
    const last = s.checks.filter((c) => c.rev === s.versions.length).pop();
    return last ? last.d : "cek";
  }
  if (!s.files.length) return "belum";
  const rev = s.files[s.files.length - 1].rev;
  const last = s.checks.filter((c) => c.rev === rev).pop();
  return last ? last.d : "cek";
}
function prog(list) {
  let fin = 0, fil = 0, n = 0, cek = 0;
  list.forEach((i) => SLOTS.forEach(([k]) => { const s = state(i, k); n++; if (s === "final" || s === "skip") fin++; if (s !== "belum") fil++; if (s === "cek" && k !== "bom") cek++; }));
  return { fin, fil, n, cek };
}
const roomOf = (id) => rooms.find((r) => r.id === id);
const taskOf = (r) => hr.filter((t) => t.scope === r.id && t.kind === "ruangan").pop();
function settle() { // a room task closes itself when every box is final or not needed
  hr.forEach((t) => { if (t.kind !== "ruangan") return; const p = prog(roomOf(t.scope).items);
    if (t.status === "OPEN" && p.n > 0 && p.fin === p.n) { t.status = "DONE"; t.doneAt = TODAY; toastAdd(` Semua kotak ${t.scope} final: tugas HRD ${t.no} selesai sendiri.`); } });
  hr.forEach((t) => { if (t.kind !== "revisi" || t.status !== "OPEN") return; const i = items.find((x) => x.no === t.item); const s = state(i, t.slot);
    if (s === "final" || s === "skip") { t.status = "DONE"; t.doneAt = TODAY; toastAdd(` Tugas revisi ${t.no} selesai sendiri.`); } });
}

function toastAdd(s) { pendingToast += s; }
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg + pendingToast; pendingToast = ""; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4200); }

function chips(i) { return `<span class="chips">${SLOTS.map(([k]) => { const s = state(i, k); return `<span class="chip c-${s}" title="${SLOT[k].l}: ${ST[s][0]}">${SLOT[k].s}</span>`; }).join("")}</span>`; }
function bar(p, label = true) { return `<div class="pg"><div class="bar" role="img" aria-label="${p.fin} final, ${p.fil} terisi dari ${p.n}"><span class="fin" style="width:${p.n ? p.fin / p.n * 100 : 0}%"></span><span class="fil" style="width:${p.n ? (p.fil - Math.min(p.fil, p.fin)) / p.n * 100 : 0}%"></span></div>${label ? `<span class="small muted num">${p.fil} terisi · ${p.fin} final / ${p.n}</span>` : ""}</div>`; }
function dueTxt(t) { if (!t) return `<span class="muted">belum ditugaskan</span>`; if (t.status === "DONE") return `<span class="badge b-green">selesai ${fmt(t.doneAt)}</span>`; const d = days(TODAY, t.due); return d < 0 ? `<span style="color:var(--bad);font-weight:600">lewat ${-d} hari</span>` : `${fmt(t.due)} · ${d} hari lagi`; }

  if (k === "spec") sl.versions.forEach((v, n) => ev.push([v.at, `<b>versi ${n + 1}</b> ditulis ${esc(v.by)}`]));
  else sl.files.forEach((f) => ev.push([f.at, `<b>rev ${f.rev}</b> diunggah ${esc(f.by)}`]));
  sl.checks.forEach((c) => ev.push([c.at, `${k === "spec" ? "versi " + c.rev : "rev " + c.rev}: <b>${c.d === "final" ? "Final" : "Revisi"}</b> (${esc(c.by)})${c.note ? ` <q>${esc(c.note)}</q>` : ""}`]));
  if (!ev.length) return "";
  return `<ul class="hist">${ev.map(([d, t]) => `<li><span class="mono">${fmt(d)}</span> ${t}</li>`).join("")}</ul>`;
}

function progres() {
  const ps = []; data.forEach((c) => c.projects.forEach((p) => ps.push({ c, p })));
  const waiting = []; items.forEach((i) => SLOTS.forEach(([k]) => { if (k !== "bom" && state(i, k) === "cek") { const sl = i[k]; const at = k === "spec" ? sl.versions[sl.versions.length - 1].at : sl.files[sl.files.length - 1].at; waiting.push({ i, k, at }); } }));
  waiting.sort((a, b) => a.at.localeCompare(b.at));
  return `<div class="ph"><span class="crumb">Desain</span><h1>Progres</h1><p>Semua angka dihitung dari kotak kelengkapan. Tidak ada yang mengetik persen.</p></div>
  ${ps.map(({ c, p }) => { const rs = p.collections.flatMap((co) => co.rooms); const pp = prog(rs.flatMap((r) => r.items));
    return `<section class="card" style="margin-bottom:14px"><header><h3>${esc(c.client)} › ${p.code} ${esc(p.name)}</h3><span style="margin-left:auto">${bar(pp)}</span></header>
      <div class="tw"><table class="items"><thead><tr><th>Ruangan</th><th>Item</th><th>Progres</th><th>Menunggu cek</th><th>Drafter</th><th>Tenggat</th></tr></thead><tbody>
      ${rs.map((r) => { const rp = prog(r.items), t = taskOf(r); return `<tr class="pick" data-act="open-room" data-id="${r.id}" tabindex="0"><td><b>${esc(r.name)}</b><div class="mono muted">${r.id}</div></td><td class="num">${r.items.length}</td><td>${r.items.length ? bar(rp) : `<span class="muted small">belum ada item</span>`}</td><td class="num">${rp.cek ? `<span class="badge b-blue">${rp.cek}</span>` : "—"}</td><td>${t ? t.assignee : "—"}</td><td class="small">${dueTxt(t)}</td></tr>`; }).join("")}
      </tbody></table></div></section>`; }).join("")}
  <div class="two">
    <section class="card"><header><h3>Per drafter</h3><span class="sub">Ruangan yang ditugaskan dan masih terbuka.</span></header><div class="pad load">
      ${DRAFTERS.map((d) => { const ts = hr.filter((t) => t.assignee === d && t.status === "OPEN" && t.kind === "ruangan"); const its = ts.flatMap((t) => roomOf(t.scope).items); const late = ts.filter((t) => t.due < TODAY).length;
        return `<div class="person"><b>${d}</b>${its.length ? bar(prog(its)) : `<span class="small muted">tidak ada tugas terbuka</span>`}<span class="small">${ts.length} ruangan${late ? ` · <span style="color:var(--bad);font-weight:600">${late} lewat</span>` : ""}</span></div>`; }).join("")}</div></section>
    <section class="card"><header><h3>Menunggu cek</h3><span class="sub">File terbaru yang belum diperiksa, yang paling lama di atas.</span></header><ul class="q">
      ${waiting.length ? waiting.map((w) => `<li><span class="what"><b>${esc(w.i.name)} · ${SLOT[w.k].l}</b><span class="mono muted">${w.i.no}</span></span><span class="badge ${days(w.at, TODAY) >= 2 ? "b-amber" : ""}">${days(w.at, TODAY)} hari</span><button class="btn sm out" data-act="open-item" data-id="${w.i.no}">Buka</button></li>`).join("") : `<li class="muted small">Tidak ada yang menunggu.</li>`}</ul></section>
  </div>`;
}

function hrd() {
  const rows = hr.slice().sort((a, b) => (a.status === b.status ? a.due.localeCompare(b.due) : a.status === "OPEN" ? -1 : 1));
  return `<div class="ph"><span class="crumb">HRD › Tugas</span><h1>Tugas tim drafter</h1><p>Tugas HRD biasa: lonceng, rencana harian, Roadmap, dan KPI berlaku. Progresnya dibaca dari kotak kelengkapan dan tugasnya selesai sendiri. HRD tidak memasukkan apa pun.</p></div>
  <section class="card"><div class="tw"><table class="items"><thead><tr><th>Tugas</th><th>Pemegang</th><th>Progres</th><th>Tenggat</th><th>Status</th></tr></thead><tbody>
  ${rows.map((t) => { const r = roomOf(t.scope); const its = t.kind === "ruangan" ? r.items : [items.find((x) => x.no === t.item)];
    const p = t.kind === "ruangan" ? prog(its) : (() => { const s = state(its[0], t.slot); return { fin: s === "final" || s === "skip" ? 1 : 0, fil: s === "belum" ? 0 : 1, n: 1 }; })();
    const title = t.kind === "ruangan" ? `Desain ${r.id} ${r.name} — ${r.items.length} item, ${r.items.length * 6} kotak` : `Revisi ${SLOT[t.slot].l} ${t.item}`;
    const d = days(TODAY, t.due);
    return `<tr><td><b>${esc(title)}</b><div class="mono muted">${t.no} · sumber: Desain</div>${t.note ? `<div class="small">“${esc(t.note)}”</div>` : ""}</td><td>${t.assignee}</td><td>${bar(p)}</td>
      <td class="small num">${fmt(t.due)}${t.status === "OPEN" && d < 0 ? `<div style="color:var(--bad);font-weight:600">lewat ${-d} hari</div>` : ""}</td>
      <td>${t.status === "DONE" ? `<span class="badge b-green">Selesai ${fmt(t.doneAt)}</span><div class="small muted">${t.doneAt <= t.due ? "tepat waktu" : `telat ${days(t.due, t.doneAt)} hari`} · otomatis</div>` : `<span class="badge b-blue">Terbuka</span><div class="small muted">selesai sendiri saat semua final</div>`}</td></tr>`; }).join("")}
  </tbody></table></div></section>`;
}

/* ── actions ── */
const val = (id) => (document.getElementById(id) || {}).value || "";
const itemBy = (no) => items.find((i) => i.no === no);
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-screen],[data-go],[data-as],[data-act]"); if (!b) return;
  if (b.dataset.screen || b.dataset.go) { screen = b.dataset.screen || b.dataset.go; form = null; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.as) { as = b.dataset.as; form = null; render(); toast(as === "cek" ? "Sebagai Wulan: Final, Revisi, Tidak perlu, dan Tugaskan ruangan." : "Sebagai Made: hanya Unggah dan Spesifikasi."); return; }
  const a = b.dataset.act, [no, k] = (b.dataset.id || "").split("|"), i = itemBy(no);
  if (a === "room") { sel.room = b.dataset.id; sel.item = (roomOf(sel.room).items[0] || {}).no; form = null; }
  else if (a === "item") { sel.item = b.dataset.id; form = null; }
  else if (a === "cancel") form = null;
  else if (a === "add") form = { kind: "tree", label: b.dataset.kind };
  else if (a === "tree-save") { if (!val("tree-name").trim()) return toast("Isi namanya dulu."); toast("Tersimpan. Di preview ini pohonnya tidak berubah."); form = null; }
  else if (a === "add-item") form = { kind: "item" };
  else if (a === "item-save") { const r = roomOf(sel.room), name = val("it-name").trim(); if (!name) return toast("Item dinamai apa?");
    const n = { no: `${r.id}-${String(r.items.length + 1).padStart(2, "0")}`, name, qty: +val("it-qty") || 1, size: val("it-size") || "— × — × —", pdf: slot(), dwg: slot(), render: slot(), foto: slot(), spec: { versions: [], checks: [], skip: null }, bom: { state: "none" }, room: r };
    r.items.push(n); items.push(n); sel.item = n.no; form = null; toast(`${n.no} dibuat dengan enam kotak kosong.${taskOf(r) && taskOf(r).status === "OPEN" ? ` Tugas ${taskOf(r).no} sekarang ${r.items.length * 6} kotak.` : ""}`); }
  else if (a === "assign-form") form = { kind: "assign" };
  else if (a === "assign-save") { const r = roomOf(sel.room); const t = { no: `TSK-26-0${++hrSeq}`, scope: r.id, kind: "ruangan", assignee: val("as-who"), due: val("as-due"), status: "OPEN", doneAt: null }; hr.push(t); form = null; toast(`${r.id} ditugaskan ke ${t.assignee}. Tugas HRD ${t.no}, tenggat ${fmt(t.due)}, lonceng terkirim.`); }
  else if (a === "upload") { const sl = i[k]; const by = as === "drafter" ? "Made" : "Wulan"; sl.files.push({ by, at: TODAY, ext: k === "pdf" ? "pdf" : k === "dwg" ? "dwg" : "jpg", rev: nextLetter(sl.files.length) }); toast(`${SLOT[k].l} rev ${nextLetter(sl.files.length - 1)} tersimpan di Drive …/${i.no}. Menunggu cek.`); }
  else if (a === "spec-edit") form = { kind: "spec", item: no };
  else if (a === "spec-save") { const t = val("spec-text").trim(); const it = itemBy(form.item); if (!t) return toast("Spesifikasinya kosong."); it.spec.versions.push({ text: t, by: as === "drafter" ? "Made" : "Wulan", at: TODAY }); form = null; toast(`Spesifikasi versi ${it.spec.versions.length} tersimpan. Menunggu cek.`); }
  else if (a === "final") { const sl = i[k]; const rev = k === "spec" ? sl.versions.length : sl.files[sl.files.length - 1].rev; sl.checks.push(ck(rev, "final", "Wulan", TODAY)); settle(); toast(`${SLOT[k].l} ${i.no} final.`); }
  else if (a === "revisi") form = { kind: "revisi", item: no, slot: k };
  else if (a === "revisi-save") { const note = val("rv-note").trim(); if (!note) return toast("Tulis satu kalimat: drafter membacanya sebagai instruksi."); const it = itemBy(form.item), sl = it[form.slot], kk = form.slot;
    const rev = kk === "spec" ? sl.versions.length : sl.files[sl.files.length - 1].rev; sl.checks.push(ck(rev, "revisi", "Wulan", TODAY, note));
    const rt = taskOf(it.room); let msg = `${SLOT[kk].l} ${it.no}: revisi diminta.`;
    if (rt && rt.status === "DONE") { const t = { no: `TSK-26-0${++hrSeq}`, scope: it.room.id, kind: "revisi", item: it.no, slot: kk, assignee: rt.assignee, due: val("rv-due"), status: "OPEN", doneAt: null, note }; hr.push(t); msg += ` Ruangan sudah selesai, jadi tugas revisi ${t.no} dibuat untuk ${t.assignee}.`; }
    else if (rt) msg += ` Progres tugas ${rt.no} turun.`;
    form = null; toast(msg); }
  else if (a === "skip") form = { kind: "skip", item: no, slot: k };
  else if (a === "skip-save") { const why = val("sk-why").trim(); if (!why) return toast("Alasannya satu kalimat saja."); itemBy(form.item)[form.slot].skip = why; const s = form.slot; form = null; settle(); toast(`${SLOT[s].l} ditandai tidak perlu.`); }
  else if (a === "unskip") { i[k].skip = null; toast(`${SLOT[k].l} perlu lagi.`); }
  else if (a === "bom") { const bm = i.bom; if (bm.state === "none") { bm.state = "draft"; bm.rev = 1; toast("Produk dan BOM draft dibuat dari item (di /produksi/bom). Kotak BOM: menunggu rilis."); } else { bm.state = "released"; settle(); toast(`BOM rev ${bm.rev} dirilis di /produksi/bom. Kotak BOM final sendiri.`); } }
  else if (a === "open-room") { sel.room = b.dataset.id; sel.item = (roomOf(sel.room).items[0] || {}).no; screen = "ws"; form = null; render(); window.scrollTo(0, 0); return; }
  else if (a === "open-item") { const it = itemBy(b.dataset.id); sel.room = it.room.id; sel.item = it.no; screen = "ws"; as = "cek"; form = null; render(); document.getElementById("item-panel")?.scrollIntoView({ block: "start" }); return; }
  else return;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr.pick")) e.target.click(); });
render();
})();
</script>
