];

/* ── derived, never stored ── */
function state(i, k) {
  if (k === "bom") return i.bom.rev ? "ada" : i.bom.skip ? "skip" : "kosong";
  return i[k].skip ? "skip" : i[k].versions.length ? "ada" : "kosong";
}
function prog(list) { let fil = 0, n = 0; list.forEach((i) => SLOTS.forEach(([k]) => { n++; if (state(i, k) !== "kosong") fil++; })); return { fil, n }; }
const roomOf = (id) => rooms.find((r) => r.id === id);
const taskOf = (r) => hr.find((t) => t.scope === r.id);
let pending = "";
function settle() {
  hr.forEach((t) => { const p = prog(roomOf(t.scope).items);
    if (t.status === "OPEN" && p.n && p.fil === p.n) { t.status = "DONE"; t.doneAt = TODAY; pending += ` Semua kotak ${t.scope} terisi: tugas ${t.no} selesai sendiri${t.doneAt <= t.due ? ", tepat waktu" : `, telat ${days(t.due, t.doneAt)} hari`}.`; } });
}

let screen = "plan", tab = "kerja", sel = { room: "26003-A-LR", item: "26003-A-LR-01" }, form = null;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg + pending; pending = ""; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4500); }

const chips = (i) => `<span class="chips">${SLOTS.map(([k]) => { const s = state(i, k); return `<span class="chip c-${s}" title="${SLOT[k].l}: ${s === "ada" ? "terisi" : s === "skip" ? "tidak perlu" : "kosong"}">${SLOT[k].s}</span>`; }).join("")}</span>`;
const bar = (p) => `<div class="pg"><div class="bar" role="img" aria-label="${p.fil} dari ${p.n} kotak terisi"><span class="fin" style="width:${p.n ? p.fil / p.n * 100 : 0}%"></span></div><span class="small muted num">${p.fil} / ${p.n} terisi</span></div>`;
function dueTxt(t) { if (!t) return `<span class="muted">belum ditugaskan</span>`; if (t.status === "DONE") return `<span class="badge b-green">selesai ${fmt(t.doneAt)}</span>`; const d = days(TODAY, t.due); return d < 0 ? `<span style="color:var(--bad);font-weight:600">lewat ${-d} hari</span>` : `${fmt(t.due)} · ${d} hari lagi`; }

/* ── screens ── */
function render() {
  document.querySelectorAll("[data-screen]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.screen === screen)));

}

function boxHtml(i, k) {
  const s = state(i, k), b = i[k];
  const badge = s === "ada" ? `<span class="badge b-green">${k === "bom" ? `rev ${i.bom.rev}` : k === "spec" ? `versi ${b.versions.length}` : `versi ${L(b.versions.length - 1)}`}</span>` : s === "skip" ? `<span class="badge">tidak perlu</span>` : `<span class="badge">kosong</span>`;
  const open = form && form.item === i.no && form.slot === k;
  let body = "", acts = "";
  if (k === "bom") {
    body = i.bom.rev ? `<p class="small">BOM rev ${i.bom.rev} · biaya produksi <b class="num">Rp ${i.bom.cost.toLocaleString("id-ID")}</b> / unit</p><p class="small muted">Dipakai quotation <i>Dari desain</i>. Diubah di /produksi/bom.</p>`
      : s === "skip" ? `<p class="small muted">${esc(i.bom.skip.note || "Tidak perlu")}</p>` : `<p class="small muted">Belum ada BOM. Buat sekarang supaya item bisa dihargai di quotation.</p>`;
    acts = !i.bom.rev && s !== "skip" ? `<button class="btn sm out" data-act="bom" data-id="${i.no}">Buat produk &amp; BOM</button><button class="btn sm ghost" data-act="skip" data-id="${i.no}|bom">Tidak perlu</button>` : s === "skip" ? `<button class="btn sm ghost" data-act="unskip" data-id="${i.no}|bom">Perlu lagi</button>` : "";
  } else if (s === "skip") {
    body = `<p class="small muted">${esc(b.skip.note || "Tidak perlu")} · ${esc(b.skip.by)}, ${fmt(b.skip.at)}</p>`;
    acts = `<button class="btn sm ghost" data-act="unskip" data-id="${i.no}|${k}">Perlu lagi</button>`;
  } else {
    const last = b.versions[b.versions.length - 1];
    if (k === "spec") body = last ? `<p class="small">${esc(last.text)}</p>` : `<p class="small muted">Belum diisi.</p>`;
    else body = last ? `<span class="file"><span class="ext ${k === "dwg" ? "dwg" : k === "pdf" ? "" : "img"}">${k === "pdf" ? "PDF" : k === "dwg" ? "DWG" : "JPG"}</span>${i.no}_${k}_${L(b.versions.length - 1)}.${k === "pdf" ? "pdf" : k === "dwg" ? "dwg" : "jpg"}</span>` : `<p class="small muted">Belum ada file.</p>`;
    if (k === "dwg" && b.versions.length && i.pdf.versions.length > b.versions.length) body += `<span class="badge b-amber">DWG versi ${L(b.versions.length - 1)}, PDF sudah versi ${L(i.pdf.versions.length - 1)}</span>`;
    acts = k === "spec" ? `<button class="btn sm out" data-act="up" data-id="${i.no}|spec">${last ? "Ubah" : "Isi"}</button>` : `<button class="btn sm out" data-act="up" data-id="${i.no}|${k}">Unggah${last ? ` versi ${L(b.versions.length)}` : ""}</button>`;
    if (!last) acts += `<button class="btn sm ghost" data-act="skip" data-id="${i.no}|${k}">Tidak perlu</button>`;
  }
  const formHtml = open && form.kind === "up" ? `<div class="form">${k === "spec" ? `<label class="f" for="sp-text">Spesifikasi<textarea class="in" id="sp-text" placeholder="Material, finishing, hardware, kain…">${esc((b.versions[b.versions.length - 1] || {}).text || "")}</textarea></label>` : `<div class="small">File dipilih → disimpan sebagai <b>versi ${L(b.versions.length)}</b> di Drive …/${i.no}</div>`}

      <div class="row"><button class="btn sm" data-act="up-save">Simpan</button><button class="btn sm ghost" data-act="cancel">Batal</button></div></div>`
    : open && form.kind === "skip" ? `<div class="form"><label class="f" for="sk-note">Catatan (boleh kosong)<input class="in" id="sk-note" placeholder="mis. desain dari klien"></label><div class="row"><button class="btn sm" data-act="skip-save">Tandai tidak perlu</button><button class="btn sm ghost" data-act="cancel">Batal</button></div></div>` : "";
  const hist = k === "bom" || !b.versions || !b.versions.length ? "" : `<ul class="hist">${b.versions.map((x, n) => `<li><span class="mono">${fmt(x.at)}</span> <b>${k === "spec" ? "versi " + (n + 1) : "versi " + L(n)}</b> ${esc(x.by)}${x.note ? ` <q>${esc(x.note)}</q>` : ""}</li>`).reverse().join("")}</ul>`;
  return `<div class="box s-${s}"><h4>${SLOT[k].l}${badge}</h4>${body}${formHtml || (acts ? `<div class="row">${acts}</div>` : "")}${hist}</div>`;
}

/* ── actions ── */
const val = (id) => (document.getElementById(id) || {}).value || "";
const itemBy = (no) => items.find((i) => i.no === no);
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-screen],[data-go],[data-tab],[data-act]"); if (!b) return;
  if (b.dataset.screen || b.dataset.go) { screen = b.dataset.screen || b.dataset.go; form = null; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.tab) { tab = b.dataset.tab; form = null; render(); return; }
  const a = b.dataset.act, [no, k] = (b.dataset.id || "").split("|"), i = itemBy(no);
  if (a === "room") { sel.room = b.dataset.id; sel.item = (roomOf(sel.room).items[0] || {}).no; form = null; }
  else if (a === "item") { sel.item = b.dataset.id; form = null; }
  else if (a === "cancel") form = null;
  else if (a === "add") form = { kind: "tree", label: b.dataset.kind };
  else if (a === "tree-save") { if (!val("tree-name").trim()) return toast("Isi namanya dulu."); toast("Tersimpan. Di preview ini pohonnya tidak berubah."); form = null; }
  else if (a === "add-item") form = { kind: "item" };
  else if (a === "item-save") { const r = roomOf(sel.room), name = val("it-name").trim(); if (!name) return toast("Item dinamai apa?");
    const n = { no: `${r.id}-${String(r.items.length + 1).padStart(2, "0")}`, name, qty: +val("it-qty") || 1, size: val("it-size") || "— × — × —", ...empty(), room: r };
    r.items.push(n); items.push(n); sel.item = n.no; form = null; const t = taskOf(r);
    toast(`${n.no} dibuat dengan enam kotak kosong.${t && t.status === "OPEN" ? ` Tugas ${t.no} sekarang ${r.items.length * 6} kotak.` : ""}`); }
  else if (a === "assign-form") form = { kind: "assign" };
  else if (a === "assign-save") { const r = roomOf(sel.room); const t = { no: `TSK-26-0${++hrSeq}`, scope: r.id, assignee: val("as-who"), due: val("as-due"), status: "OPEN", doneAt: null }; hr.push(t); form = null; settle(); toast(`${r.id} ditugaskan ke ${t.assignee}, tenggat ${fmt(t.due)}. Muncul di HRD › Tugas sebagai ${t.no}.`); }
  else if (a === "up") form = { kind: "up", item: no, slot: k };
  else if (a === "up-save") { const it = itemBy(form.item), kk = form.slot, bx = it[kk];
    if (kk === "spec" && !val("sp-text").trim()) return toast("Spesifikasinya masih kosong.");
    bx.versions.push(v(ME, TODAY, val("up-note").trim() || null, kk === "spec" ? val("sp-text").trim() : null));
    const label = kk === "spec" ? `versi ${bx.versions.length}` : `versi ${L(bx.versions.length - 1)}`; form = null; settle();
    toast(`${SLOT[kk].l} ${it.no} ${label} tersimpan. Ini yang berlaku sekarang.`); }
  else if (a === "skip") form = { kind: "skip", item: no, slot: k };
  else if (a === "skip-save") { const it = itemBy(form.item), kk = form.slot; (kk === "bom" ? it.bom : it[kk]).skip = { by: ME, at: TODAY, note: val("sk-note").trim() || null }; form = null; settle(); toast(`${SLOT[kk].l} ditandai tidak perlu, dihitung terisi.`); }
  else if (a === "unskip") { (k === "bom" ? i.bom : i[k]).skip = null; toast(`${SLOT[k].l} perlu lagi.`); }
  else if (a === "bom") { i.bom.rev = 1; i.bom.cost = 2350000; settle(); toast(`Produk dibuat dari ${i.no} (dari desain, belum di katalog aktif) dengan BOM rev 1. Biaya muncul di quotation Dari desain.`); }
  else if (a === "open-room") { sel.room = b.dataset.id; sel.item = (roomOf(sel.room).items[0] || {}).no; tab = "kerja"; form = null; render(); window.scrollTo(0, 0); return; }
  else if (a === "open-item") { const it = itemBy(b.dataset.id); sel.room = it.room.id; sel.item = it.no; tab = "kerja"; form = null; render(); document.getElementById("item-panel")?.scrollIntoView({ block: "start" }); return; }
  else return;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr.pick")) e.target.click(); });
render();
})();
</script>
