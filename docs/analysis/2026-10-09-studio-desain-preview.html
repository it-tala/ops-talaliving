function revStatus(r, track) {
  if (track === "klien") return ["Dari klien, tanpa review", ""];
  if (r.released) return ["Dirilis ke bengkel", "b-green"];
  const last = r.reviews[r.reviews.length - 1];
  if (!last) return ["Diajukan, menunggu cek internal", "b-blue"];
  if (last.d === "revisi") return [last.side === "klien" ? "Klien minta revisi" : "Dikembalikan internal", "b-amber"];
  if (last.d === "tolak") return ["Ditolak", "b-red"];
  if (last.side === "internal") return ["Lolos cek, menunggu klien", "b-violet"];
  return [track === "kerja" ? "Disetujui klien, siap rilis" : "Disetujui klien", "b-green"];
}
function itemStatus(i) {
  const k = i.tracks.kerja, last = k[k.length - 1];
  if (!last) return i.tracks.render.length ? ["DRAWN", "b-blue"] : ["CONCEPT", ""];
  const s = revStatus(last, "kerja")[0];
  if (s.startsWith("Dirilis")) return ["RILIS", "b-green"];
  if (s.startsWith("Disetujui")) return ["APPROVED", "b-green"];
  return ["DRAWN", "b-blue"];
}
function openTask(i, track) { return i.tasks.find((t) => t.track === track); }
function taskDone(i, t) { const h = hr.find((x) => x.no === t.hr); return h && h.status === "DONE"; }

    .concat(r.released ? [`<li class="ok"><span><b>Dirilis ke bengkel</b> ${fmt(r.released)}</span></li>`] : []);
  return `<div class="rev ${latest ? "latest" : "old"}"><span class="tag">${r.rev}</span>

    <div><ul class="trail">${trail.join("")}</ul>
      ${form && form.kind === "review" && form.track === k && latest ? reviewForm() : actions ? `<div class="row" style="margin-top:8px">${actions}</div>` : ""}</div></div>`;
}

    else if (l && l.side === "internal" && l.d === "ok") waiting.push({ i, k, r, who: "klien", d: days(l.at, TODAY) }); }));

  return `<div class="ph"><span class="crumb">Desain</span><h1>Papan drafter</h1><p>Apa yang macet, apa yang lewat, siapa yang penuh. Tenggat dari tugas, Job Order terbuka, atau target proyek. Beban dihitung dari tugas HRD tiap orang.</p></div>

    <div><dt>Belum dipegang</dt><dd class="${unassigned.length ? "warn" : ""}">${unassigned.length}</dd><p>tugas tanpa orang</p></div>

  <div class="two">

      <div class="pad load">${load.map((l) => `<div class="person"><b>${l.p}</b><div class="bar" role="img" aria-label="${l.late} lewat, ${l.week} minggu ini, ${l.later} sesudahnya">
        <span class="late" style="width:${l.late / max * 100}%"></span><span class="week" style="width:${l.week / max * 100}%"></span><span class="later" style="width:${l.later / max * 100}%"></span></div>
        <span class="small num">${l.late + l.week + l.later} terbuka</span></div>`).join("")}
        <div class="legend"><span><i style="background:var(--bad)"></i>lewat tenggat</span><span><i style="background:var(--warn)"></i>7 hari ke depan</span><span><i style="background:var(--brand)"></i>sesudahnya</span></div></div></section>
    <section class="card"><header><h3>Belum dipegang</h3></header><ul class="q">${unassigned.length ? unassigned.map((r) => `<li><span class="what"><b>${esc(r.i.name)} · ${TRACKS[r.t.track]}</b><span class="mono muted">${r.i.no}</span></span>
      <span class="small">tenggat ${fmt(r.t.due)}</span><select class="in" style="width:auto" data-act="board-assign" data-id="${r.i.no}|${r.t.track}" aria-label="Tugaskan"><option value="">Tugaskan ke…</option>${DRAFTERS.map((d) => `<option>${d}</option>`).join("")}</select></li>`).join("") : `<li class="muted small">Semua tugas sudah dipegang.</li>`}</ul></section>
  </div>

    <section class="card"><header><h3>Menunggu review</h3></header><ul class="q">${waiting.length ? waiting.map((w) => `<li><span class="what"><b>${esc(w.i.name)} · ${TRACKS[w.k]} rev ${w.r.rev}</b><span class="mono muted">${w.i.no}</span></span><span class="badge ${w.d >= (w.who === "klien" ? 5 : 2) ? "b-amber" : ""}">${w.who} · ${w.d} hari</span><button class="btn sm out" data-act="open-item" data-id="${w.i.no}">Buka</button></li>`).join("") : `<li class="muted small">Tidak ada yang menunggu.</li>`}</ul></section>

function findRoom(id) { const [p, c, r] = id.split("-"); for (const cl of data) for (const pr of cl.projects) if (pr.code === p) for (const co of pr.collections) if (co.code === c) for (const ro of co.rooms) if (ro.code === r) { ro.ctx = { client: cl.client, project: pr, coll: co }; return ro; } }
function curItem() { return allItems.find((i) => i.no === sel.item); }
const val = (id) => (document.getElementById(id) || {}).value;

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-screen],[data-go],[data-act]"); if (!b) return;
  if (b.dataset.screen || b.dataset.go) { screen = b.dataset.screen || b.dataset.go; form = null; render(); window.scrollTo(0, 0); return; }
  const a = b.dataset.act, id = b.dataset.id, i = curItem();
  if (b.tagName === "SELECT" || (b.tagName === "INPUT" && b.type === "date")) return;
  if (a === "room") { sel.room = id; sel.item = (findRoom(id).items[0] || {}).no; form = null; }
  else if (a === "item") { sel.item = id; form = null; }
  else if (a === "tab") { sel.tab = id; form = null; }
  else if (a === "cancel") form = null;
  else if (a === "add") form = { kind: "tree", label: { client: "Nama klien (masuk ke master data klien)", project: "Kode dan nama proyek", coll: "Kode dan nama koleksi", room: "Kode dan nama ruangan" }[b.dataset.kind], ph: { client: "mis. Ibu Laras", project: "26009 Rumah Sanur", coll: "C · TYPE 3BR", room: "KT · Kitchen" }[b.dataset.kind], sub: b.dataset.kind };
  else if (a === "tree-save") { const v = val("tree-name").trim(); if (!v) return toast("Isi namanya dulu."); toast(`Tersimpan: ${v}. Di preview ini tidak ditambahkan ke pohon.`); form = null; }
  else if (a === "add-item") form = { kind: "item" };
  else if (a === "item-save") {
    const room = findRoom(sel.room), name = val("it-name").trim(); if (!name) return toast("Item dinamai apa?");
    const no = `${room.ctx.project.code}-${room.ctx.coll.code}-${room.code}-${String(room.items.length + 1).padStart(2, "0")}`;
    const size = (val("it-size") || "").split(/[^\d]+/).filter(Boolean).map(Number);
    const it = { no, name, qty: +val("it-qty") || 1, size: size.length === 3 ? size : ["—", "—", "—"], origin: val("it-origin"), specs: {}, tracks: { kerja: [], render: [], foto: [], klien: [] }, bom: { product: null },
      tasks: [{ no: `DSN-00${49 + allItems.length}`, track: "kerja", assignee: val("it-who") || null, due: val("it-due"), round: 1 }], ctx: { client: room.ctx.client, project: room.ctx.project, coll: room.ctx.coll, room } };
    room.items.push(it); allItems.push(it); sel.item = no; sel.tab = "task"; form = null;
    const t = it.tasks[0]; if (t.assignee) { const h = hrTask(t, it); toast(`${no} dibuat. Tugas HRD ${h.no} untuk ${t.assignee}, tenggat ${fmt(t.due)}.`); } else toast(`${no} dibuat. Tugas gambar kerja masuk antrean, belum dipegang.`);
  }
  else if (a === "spec-add") form = { kind: "spec" };
  else if (a === "spec-save") { const g = val("sp-g"), l = val("sp-l").trim(), v = val("sp-v").trim(); if (!l || !v) return toast("Isi bagian dan isinya."); (i.specs[g] = i.specs[g] || []).push([l, v]); form = null; toast("Spesifikasi tersimpan dan tercatat di riwayat."); }
  else if (a === "upload") form = { kind: "upload", track: id };
  else if (a === "up-save") {
    const k = form.track, revs = i.tracks[k], rev = nextRev(revs);
    const files = k === "kerja" ? [f(`${i.no}_rev${rev}.pdf`)].concat(document.getElementById("up-dwg").checked ? [f(`${i.no}_rev${rev}.dwg`)] : []) : [f(k === "klien" ? `dari-klien-${rev}.jpg` : `${i.no}-${k}-${rev}.jpg`)];
    const t = openTask(i, k), by = (t && t.assignee) || "Made";
    revs.push({ rev, files, at: TODAY, by, reviews: [], released: null, note: val("up-note").trim() });
    let msg = `Rev ${rev} diunggah dan diajukan.`;
    if (t) { const h = hr.find((x) => x.no === t.hr && x.status === "OPEN"); if (h) { h.status = "DONE"; h.delivered = `Rev ${rev} diajukan ${fmt(TODAY)}`; msg += ` Tugas HRD ${h.no} selesai.`; } }
    form = null; toast(msg);
  }
  else if (a === "rev") {
    const d = b.dataset.d, r = i.tracks[id][i.tracks[id].length - 1];
    if (d === "int-ok") { r.reviews.push({ side: "internal", d: "ok", by: "Wulan (kepala drafter)", at: TODAY }); toast(`Rev ${r.rev} lolos cek internal. Menunggu klien.`); }
    else if (d === "kl-ok") { r.reviews.push({ side: "klien", d: "ok", by: `${i.ctx.client} · WhatsApp`, at: TODAY }); toast(`Klien menyetujui rev ${r.rev}.`); }
    else form = { kind: "review", track: id, d };
  }
  else if (a === "rv-save") {
    const why = val("rv-why").trim(); if (!why) return toast("Alasan wajib diisi: drafter membacanya sebagai instruksi.");
    const k = form.track, r = i.tracks[k][i.tracks[k].length - 1], cat = val("rv-cat"), due = val("rv-due");
    const side = form.d.startsWith("int") ? "internal" : "klien", dd = form.d.endsWith("tolak") ? "tolak" : "revisi";
    r.reviews.push({ side, d: dd, by: side === "internal" ? "Wulan (kepala drafter)" : `${i.ctx.client} · ${val("rv-ch")}`, at: TODAY, cat, why });
    let t = openTask(i, k);
    if (!t) { t = { no: `DSN-00${60 + hr.length}`, track: k, assignee: r.by, due, round: 1 }; i.tasks.push(t); }
    t.round += 1; t.due = due; t.cat = cat;
    let msg = `Rev ${r.rev}: ${side === "internal" ? "dikembalikan" : dd === "tolak" ? "ditolak klien" : "klien minta revisi"}.`;
    if (t.assignee && t.assignee !== "Freelance") { const h = hrTask(t, i, `${side === "internal" ? "Cek internal" : "Klien"}: ${why}`); msg += ` Tugas HRD ${h.no} putaran ${t.round} untuk ${t.assignee}, tenggat ${fmt(due)}.`; }
    form = null; toast(msg);
  }
  else if (a === "release") { const r = i.tracks[id][i.tracks[id].length - 1]; r.released = TODAY; toast(`Rev ${r.rev} dirilis. Bengkel sekarang memotong dari rev ${r.rev}.`); }
  else if (a === "bom-make") { i.bom = { product: `PRD-0${340 + allItems.indexOf(i)}`, rev: 1, fromRev: (i.tracks.kerja[i.tracks.kerja.length - 1] || {}).rev || null, cost: null }; toast(`Produk ${i.bom.product} dibuat dari item, BOM rev 1 kosong siap diisi.`); }
  else if (a === "bom-up") { const k = i.tracks.kerja[i.tracks.kerja.length - 1]; i.bom.rev += 1; i.bom.fromRev = k.rev; toast(`Draft BOM rev ${i.bom.rev} dibuka dari gambar kerja rev ${k.rev}.`); }
  else if (a === "open-item") { const it = allItems.find((x) => x.no === id); sel.room = `${it.ctx.project.code}-${it.ctx.coll.code}-${it.ctx.room.code}`; sel.item = id; sel.tab = "file"; screen = "ws"; form = null; render(); document.getElementById("item-panel")?.scrollIntoView({ block: "start" }); return; }
  else return;
  render();
});

document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr.pick")) e.target.click(); });

document.addEventListener("change", (e) => {
  const el = e.target, a = el.dataset.act; if (!a) return;
  if (a === "board-assign") {
    const [no, k] = el.dataset.id.split("|"); const i = allItems.find((x) => x.no === no); const t = openTask(i, k); if (!el.value) return;
    t.assignee = el.value; const h = hrTask(t, i); toast(`${TRACKS[k]} ${no} ditugaskan ke ${el.value}. Tugas HRD ${h.no}, lonceng dikirim.`); render(); return;
  }
  const i = curItem(), k = el.dataset.id; let t = openTask(i, k);
  if (a === "assign") {
    if (!t) { t = { no: `DSN-00${70 + hr.length}`, track: k, assignee: null, due: val(`du-${k}`), round: 1 }; i.tasks.push(t); }
    const prev = hr.find((x) => x.no === t.hr && x.status === "OPEN");
    t.assignee = el.value || null;
    if (!t.assignee) toast("Tugas kembali ke antrean, belum dipegang.");
    else if (t.assignee === "Freelance") { if (prev) hr.splice(hr.indexOf(prev), 1), t.hr = null; toast("Drafter lepas: tugas tetap di Studio, tidak dibuat di HRD."); }
    else if (prev) { prev.assignee = t.assignee; toast(`Tugas HRD ${prev.no} pindah ke ${t.assignee}.`); }
    else { const h = hrTask(t, i); toast(`Tugas HRD ${h.no} dibuat untuk ${t.assignee}, tenggat ${fmt(t.due)}.`); }
  } else if (a === "due" && t) {
    t.due = el.value; const h = hr.find((x) => x.no === t.hr && x.status === "OPEN"); if (h) h.due = el.value;
    toast(`Tenggat ${fmt(el.value)}${h ? `, tugas HRD ${h.no} ikut berubah` : ""}.`);
  }
  render();
});

render();
})();
</script>
