# The gate in front of `main`.
#
# `main` is production, in front of a business that books real money. It is
# served by **Cloudflare Workers**, through the Workers Builds Git integration
# connected to this repository: a push to `main` runs `npx wrangler deploy` and
# goes live, a push to any other branch runs `npx wrangler versions upload` and
# produces a preview version. That is the whole deployment story for this
# repository — there is no Vercel here. (A Vercel project exists for the *old*
# repository and serves previews there; this file used to claim it deployed
# `main` to `ops.talaliving.com`, which was never true of this repository.)
#
# Because the integration deploys whatever lands on `main` and asks nothing,
# the gate cannot be the deploy: it has to be the merge. Branch protection on
# `main` requires this workflow, and pushes reach `main` only through a merged
# pull request.
#
# Two jobs, because they fail for unrelated reasons and a red tick should say
# which half broke without anybody opening the log:
#
#   app        the thing people look at — types, lint, and a production build
#   database   the thing that decides — the whole ladder from nothing, then
#              every smoke file, then the two static checks
#
# The database job is not optional politeness. Postgres is the application here
# (ADR-002): the money rules are constraints, views and `security definer`
# functions, so a migration that fails to apply is a feature that does not
# exist, and a policy that quietly stops refusing returns the right number to
# the wrong person with nothing on screen looking unusual.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless. Runs against
# `main` are never cancelled: that is the history of what was actually green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    name: app — types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22. Not a free choice any more: `wrangler` 4 and
      # `@opennextjs/cloudflare` both refuse anything older, and the Workers
      # runtime the adapter targets is built against it — so building on 20
      # here would prove the app against a Node the deploy never uses.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `tsc` first and on its own. `next.config.mjs` sets
      # `eslint.ignoreDuringBuilds`, and a Next build tolerates type errors in
      # code it does not reach — so neither of the steps below is a substitute
      # for this one, and a green build with a broken type is the kind of green
      # this project exists to distrust.
      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      # Which screens the live deployment opens is derived from which services
      # `src/lib/api` actually implements, walked through the import graph. A
      # hand-kept list would be correct on the day it was written and silently
      # wrong the first time a procurement screen grew one `hr.` call.
      - name: live routes match the code
        run: node scripts/check-live-routes.mjs

      # The same catalogue is written down twice — `src/lib/roles.ts` for
      # `can()`, `ops_core.permission_catalog` for `has_permission()` — because
      # one is read by a browser and the other inside Postgres. Hand-kept lists
      # drift, and these two already had: `accounting.plan_cash` was missing
      # from the ladder, so the cash calendar was read-only for everybody with
      # no error and no refusal, just buttons that were never drawn.
      - name: permission catalogue agrees with itself
        run: node scripts/check-permissions.mjs

      # The demo and the real client are supposed to be interchangeable — same
      # names, same arguments, same answers — because that is the whole of the
      # swap. Nothing checked it and nothing could: until the switchboard
      # existed, no file imported both, so TypeScript never saw them side by
      # side. The first time anything did, 37 of the 98 shared functions
      # disagreed, and half of a swapped pair raised no error at all because
      # `AccountBalance` is assignable to `Account`. This asks the compiler and
      # compares the answer against the list in `src/lib/api/_pending.ts`,
      # failing on drift in either direction.
      - name: the two api clients answer the same shapes
        run: node scripts/check-api-parity.mjs

      # PostgREST does not search: `.from("v_my_access")` resolves against the
      # one schema the request names, and with none it uses `public`, which this
      # project keeps empty. Nothing could catch that earlier than production —
      # `tsc` sees a string, the demo never reaches PostgREST, and the smoke
      # files talk to Postgres directly. It did reach production, on all ~100
      # calls at once. This resolves every one against the migration ladder.
      - name: every client call names the right schema
        run: node scripts/check-api-schemas.mjs

      # Until the PDF reader exists, every contract clause is typed by a person
      # into `CLAUSE_FIELDS`, while `ops_hr.clause_value_ok` decides what may be
      # stored. Two statements of one rule in two languages, neither able to see
      # the other: a choice added in SQL and forgotten in the form can never be
      # picked by anyone, and a choice offered by the form that SQL refuses is a
      # promise broken at the moment somebody presses the button.
      - name: the clause form matches the constraint behind it
        run: node scripts/check-clause-fields.mjs

      # No Supabase variables here, deliberately. The build has to succeed with
      # none set, because that is how the deployed app runs today — demo mode,
      # browser-held fixtures, no database. `useRealApi()` requires both the
      # flag and the keys, so a missing key is never silently a demo.
      - name: build
        run: npm run build

      # The application as it is actually shipped.
      #
      # Cloudflare is not a second target, it is the only one, so this step is
      # the last chance to catch a broken deploy before `main` deploys itself.
      # It catches what `npm run build` cannot: code that compiles for Node but
      # reaches for something the Workers runtime does not have, and a
      # `wrangler.jsonc` that has drifted from what the bundle produces.
      #
      # It builds Next a second time rather than reusing the step above, and
      # that is not waste: the adapter needs `output: "standalone"`, which it
      # sets itself while building, so `--skipNextBuild` against an ordinary
      # build fails looking for `.next/standalone`. Two builds, two outputs,
      # both proved.
      #
      # This step builds and never deploys — no Cloudflare token is read here,
      # and nothing it produces leaves the runner. Deploying is the Workers
      # Builds integration's job, not this workflow's; `wrangler.jsonc`
      # describes it and says where its branch rules live.
      - name: cloudflare worker builds
        run: npx opennextjs-cloudflare build

  database:
    name: database — ladder, smoke, static checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # Node and the project's own dependencies, which this job did not need
      # until `check-schedule-rules.mjs`: that gate compiles
      # `src/services/hr/schedule-rules.ts` with the repo's own `tsc` and runs
      # it against the same battery it puts to the database. Without `npm ci`,
      # `npx` would fetch a TypeScript from the network — a gate whose result
      # depends on which compiler happened to download is not a gate.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The runner ships a psql, but not necessarily one matching the server.
      # Pinning the client to 16 keeps `\copy`, error formats and `ON_ERROR_STOP`
      # behaving the way they do on the cluster the migrations were proved on.
      - name: postgresql-client 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version

      # From nothing, every time. A migration that only works against
      # yesterday's database is a migration that will fail on a fresh one, and
      # the fresh one is the production project on the day it is first applied.
      - name: apply the ladder from nothing
        run: supabase/local/rebuild.sh

      # `smoke.sh` runs `check_shadowing` and `check_schema_isolation` first,
      # then one file per schema — each proving a refusal and a derivation.
      - name: smoke
        run: supabase/local/smoke.sh

      # The guard that needs both halves at once: the TypeScript contracts and a
      # database with the ladder applied. `tsc` cannot check whether a view
      # returns the columns a cast claims — `as` is the instruction to stop
      # checking — so nothing found `v_po_detail` missing three of `PoDetail`'s
      # fields until `/procurement/po/[po]/print` had already shipped reading
      # one of them.
      - name: view contracts
        run: node scripts/check-view-contracts.mjs

      # The schedule rule, stated twice because ADR-009 makes it two systems,
      # and compared case by case. `/it/aturan-gaji` lets somebody type the
      # working patterns now, so what a pattern may say has a person on the
      # other end of it — and a demo that refuses differently from the database
      # has rehearsed the wrong sentence. Needs both halves at once: the
      # TypeScript module is compiled and executed, and the same battery is put
      # to `ops_hr.schedule_problem()`.
      - name: schedule rules say the same thing in both places
        run: node scripts/check-schedule-rules.mjs

      # John Lau's suggestions, put through his own router.
      #
      # F64 is the dock offering `stoknya menipis` while the rule said `stok
      # menipis` — the one sentence the application proposed was the one it did
      # not understand, and it was found by somebody clicking it. The router is
      # now `ops_asst.rules` and the suggestions are still a TypeScript string,
      # so the two are further apart than they were. This also refuses a
      # suggestion that routes to a module the new system has no data for,
      # which is a promise broken in the most visible place there is.
      - name: john lau offers nothing he cannot answer
        run: node scripts/check-john-lau.mjs

      # B8's import, proved on a fixture legacy system and run **twice**.
      # Idempotence is the property the whole cutover rests on and the one that
      # is never true by accident: an import against a database somebody is
      # still using is run, reconciled, corrected and run again, and a second
      # run that is not a no-op is a duplicate of money. Running it once would
      # only prove the SQL parses.
      - name: import — idempotent over two runs
        run: supabase/import/test.sh
